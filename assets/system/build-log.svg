<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bl-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F86FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2F86FF" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="bl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16223D" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="880" height="270" rx="14" fill="#0D1525" stroke="url(#bl-border)" stroke-width="1.2"/>
  <rect x="0" y="0" width="880" height="270" rx="14" fill="url(#bl-grid)"/>

  <!-- Top bar -->
  <g transform="translate(28, 24)">
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2F86FF">08 // BUILD LOG &bull; TRAJECTORY &amp; EVOLUTION</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Chronological Engineering Progression</text>
  </g>

  <!-- Timeline Line -->
  <line x1="60" y1="130" x2="820" y2="130" stroke="#1F2F4F" stroke-width="2"/>

  <!-- Node 1: 2024 -->
  <g transform="translate(60, 110)">
    <circle cx="0" cy="20" r="7" fill="#14243F" stroke="#2F86FF" stroke-width="2"/>
    <text x="-16" y="-10" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#2F86FF">2024</text>
    <text x="-25" y="46" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F5F7FA">Full-Stack Foundations</text>
    <text x="-25" y="64" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">MERN stack, REST APIs,</text>
    <text x="-25" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">modular state &amp; SQL.</text>
  </g>

  <!-- Node 2: 2025 -->
  <g transform="translate(300, 110)">
    <circle cx="0" cy="20" r="7" fill="#14243F" stroke="#2F86FF" stroke-width="2"/>
    <text x="-16" y="-10" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#2F86FF">2025</text>
    <text x="-25" y="46" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F5F7FA">AI / ML &amp; Hackathons</text>
    <text x="-25" y="64" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">Tejas Hackathon (SafeWay-AI),</text>
    <text x="-25" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">ML training, Scikit-learn pipelines.</text>
  </g>

  <!-- Node 3: 2026 -->
  <g transform="translate(560, 110)">
    <circle cx="0" cy="20" r="7" fill="#14243F" stroke="#FF3652" stroke-width="2"/>
    <text x="-16" y="-10" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#FF3652">2026</text>
    <text x="-25" y="46" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F5F7FA">Spatial AI Platforms</text>
    <text x="-25" y="64" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">SurakshaAI (Legacy Coderz Lead),</text>
    <text x="-25" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">RESQ IIT Guwahati 408k grid engine.</text>
  </g>

  <!-- Node 4: NOW -->
  <g transform="translate(790, 110)">
    <circle cx="0" cy="20" r="8" fill="#22C55E">
      <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-14" y="-10" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#22C55E">NOW</text>
    <text x="-35" y="46" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#F5F7FA">Continuous Shipping</text>
    <text x="-35" y="64" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">Civic tech, spatial scale,</text>
    <text x="-35" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#8B96A8">production engineering.</text>
  </g>
</svg>