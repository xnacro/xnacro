<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bid-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F86FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0A101F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF3652" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bid-holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F86FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF3652" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2F86FF" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="bid-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#162544" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Outer Passport / Card -->
  <rect x="0" y="0" width="880" height="280" rx="14" fill="#0D1525" stroke="url(#bid-border)" stroke-width="1.6"/>
  <rect x="0" y="0" width="880" height="280" rx="14" fill="url(#bid-grid)"/>
  <rect x="0" y="0" width="880" height="60" rx="14" fill="url(#bid-holo)"/>

  <!-- Header Stripe -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="160" height="22" rx="4" fill="#14284D" stroke="#2F86FF" stroke-width="0.8"/>
    <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#2F86FF">BUILDER ID // 01</text>
    <text x="180" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B96A8">SECURE SPECIFICATION PASSPORT</text>
    
    <rect x="740" y="-2" width="84" height="20" rx="4" fill="#1A3428"/>
    <text x="750" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#22C55E">VERIFIED &bull; OK</text>
  </g>

  <!-- Main Card Body -->
  <g transform="translate(28, 75)">
    <!-- Identity Fields -->
    <g transform="translate(0, 0)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#8B96A8">CALLSIGN / NAME</text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">PRINCE TIWARI</text>
      <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#2F86FF">@xnacro &bull; Team Leader @ Legacy Coderz</text>
    </g>

    <!-- Field 1: Role -->
    <g transform="translate(320, 0)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#8B96A8">SYSTEM ROLE</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#F5F7FA">Lead Full-Stack &amp; AI Architect</text>
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8B96A8">2+ Yrs Frontend &bull; 1+ Yr Backend &amp; ML</text>
    </g>

    <!-- Field 2: Specialization -->
    <g transform="translate(580, 0)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#8B96A8">PRIMARY VECTOR</text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#FF3652">Geospatial Risk &amp; Predictive AI</text>
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8B96A8">Dynamic Safety Index &bull; Grid SSOT</text>
    </g>
  </g>

  <!-- Lower Telemetry Block & Barcode -->
  <g transform="translate(28, 175)">
    <rect x="0" y="0" width="824" height="78" rx="8" fill="#0A101F" stroke="#1F2F4F" stroke-width="1"/>
    
    <g transform="translate(20, 20)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#8B96A8">SPECIALIZATION CODES</text>
      <text x="0" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F5F7FA">[MERN-STACK] [FASTAPI-ML] [POSTGIS-408K] [SOCKET-REALTIME]</text>
    </g>

    <g transform="translate(560, 18)">
      <!-- Stylized Barcode -->
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2F86FF" stroke-width="3"/>
      <line x1="6" y1="0" x2="6" y2="40" stroke="#8B96A8" stroke-width="1.5"/>
      <line x1="12" y1="0" x2="12" y2="40" stroke="#2F86FF" stroke-width="4"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#8B96A8" stroke-width="1"/>
      <line x1="26" y1="0" x2="26" y2="40" stroke="#2F86FF" stroke-width="2"/>
      <line x1="34" y1="0" x2="34" y2="40" stroke="#FF3652" stroke-width="3.5"/>
      <line x1="42" y1="0" x2="42" y2="40" stroke="#8B96A8" stroke-width="1"/>
      <line x1="48" y1="0" x2="48" y2="40" stroke="#2F86FF" stroke-width="3"/>
      <line x1="56" y1="0" x2="56" y2="40" stroke="#8B96A8" stroke-width="2"/>
      <line x1="64" y1="0" x2="64" y2="40" stroke="#2F86FF" stroke-width="5"/>
      <line x1="74" y1="0" x2="74" y2="40" stroke="#8B96A8" stroke-width="1"/>
      <line x1="82" y1="0" x2="82" y2="40" stroke="#FF3652" stroke-width="2"/>
      <line x1="90" y1="0" x2="90" y2="40" stroke="#2F86FF" stroke-width="4"/>
      <line x1="100" y1="0" x2="100" y2="40" stroke="#8B96A8" stroke-width="1.5"/>
      <line x1="110" y1="0" x2="110" y2="40" stroke="#2F86FF" stroke-width="3"/>
      <line x1="120" y1="0" x2="120" y2="40" stroke="#8B96A8" stroke-width="2"/>
      <line x1="130" y1="0" x2="130" y2="40" stroke="#2F86FF" stroke-width="4"/>
      
      <text x="145" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B96A8">SERIAL NO.</text>
      <text x="145" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2F86FF">XNACRO-2026-IN</text>
    </g>
  </g>
</svg>